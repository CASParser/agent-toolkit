              security_name:
                type: string
                description: Name of the security
                example: "CASTROLIND"
              security_symbol:
                type: string
                description: Trading symbol
                example: "CASTROLIND"
              buy_quantity:
                type: number
                format: float
                description: Total quantity purchased
              buy_wap:
                type: number
                format: float
                description: Weighted Average Price for buy transactions
              buy_total_value:
                type: number
                format: float
                description: Total value of buy transactions
              sell_quantity:
                type: number
                format: float
                description: Total quantity sold
              sell_wap:
                type: number
                format: float
                description: Weighted Average Price for sell transactions
              sell_total_value:
                type: number
                format: float
                description: Total value of sell transactions
              net_obligation:
                type: number
                format: float
                description: Net amount payable/receivable for this security
        derivatives_transactions:
          type: array
          description: Summary of derivatives transactions
          items:
            type: object
            properties:
              contract_description:
                type: string
                description: Derivatives contract description
                example: "NIFTY24802410DPE"
              buy_sell_bf_cf:
                type: string
                description: Transaction type (Buy/Sell/Bring Forward/Carry Forward)
                example: "B"
              quantity:
                type: number
                format: float
                description: Quantity traded
              wap_per_unit:
                type: number
                format: float
                description: Weighted Average Price per unit
              brokerage_per_unit:
                type: number
                format: float
                description: Brokerage charged per unit
              closing_rate_per_unit:
                type: number
                format: float
                description: Closing rate per unit
              net_total:
                type: number
                format: float
                description: Net total amount
        detailed_trades:
          type: array
          description: Detailed breakdown of all individual trades
          items:
            type: object
            properties:
              order_number:
                type: string
                description: Order reference number
                example: "1000000042939390"
              order_time:
                type: string
                description: Time when order was placed
                example: "13:13:13"
              trade_number:
                type: string
                description: Trade reference number
                example: "4006567"
              trade_time:
                type: string
                description: Time when trade was executed
                example: "13:13:13"
              security_description:
                type: string
                description: Security name with exchange and ISIN
                example: "CASTROLIND-EQ/INE172A01027"
              buy_sell:
                type: string
                description: Transaction type (B for Buy, S for Sell)
                example: "B"
              exchange:
                type: string
                description: Exchange name
                example: "NSE"
              quantity:
                type: number
                format: float
                description: Quantity traded
              brokerage:
                type: number
                format: float
                description: Brokerage charged for this trade
              net_rate_per_unit:
                type: number
                format: float
                description: Net rate per unit
              closing_rate_per_unit:
                type: number
                format: float
                description: Closing rate per unit
              net_total:
                type: number
                format: float
                description: Net total for this trade
              remarks:
                type: string
                description: Additional remarks or notes
        charges_summary:
          type: object
          description: Breakdown of various charges and fees
          properties:
            pay_in_pay_out_obligation:
              type: number
              format: float
              description: Net pay-in/pay-out obligation
            taxable_value_brokerage:
              type: number
              format: float
              description: Taxable brokerage amount
            exchange_transaction_charges:
              type: number
              format: float
              description: Exchange transaction charges
            cgst:
              type: number
              format: float
              description: Central GST amount
            sgst:
              type: number
              format: float
              description: State GST amount
            igst:
              type: number
              format: float
              description: Integrated GST amount
            securities_transaction_tax:
              type: number
              format: float
              description: Securities Transaction Tax
            sebi_turnover_fees:
              type: number
              format: float
              description: SEBI turnover fees
            stamp_duty:
              type: number
              format: float
              description: Stamp duty charges
            net_amount_receivable_payable:
              type: number
              format: float
              description: Final net amount receivable or payable

    # ============================================
    # Inbound Email Schemas
    # ============================================
    InboundEmail:
      type: object
      description: An inbound email address for receiving forwarded CAS emails
      properties:
        inbound_email_id:
          type: string
          description: Unique inbound email identifier
          example: "ie_a1b2c3d4e5f6"
        email:
          type: string
          format: email
          description: The inbound email address to forward CAS statements to
          example: "ie_a1b2c3d4e5f6@import.casparser.in"
        reference:
          type: [string, "null"]
          description: Your internal reference identifier
          example: "user_12345"
        callback_url:
          type: string
          format: uri
          description: |
            Webhook URL for email notifications. If set, we POST each parsed
            email here. If omitted, files are only retrievable via
            `GET /v4/inbound-email/{id}/files`.
          example: "https://api.yourapp.com/webhooks/cas-email"
        allowed_sources:
          type: array
          items:
            type: string
            enum: [cdsl, nsdl, cams, kfintech]
          description: Accepted CAS providers (empty = all)
          example: ["cdsl", "nsdl"]
        status:
          type: string
          enum: [active, paused]
          description: Current inbound email lifecycle status
          example: "active"
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Custom key-value metadata
          example:
            plan: "premium"
        created_at:
          type: string
          format: date-time
          description: When the inbound email was created
          example: "2025-02-21T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          description: When the inbound email was last updated
          example: "2025-02-21T10:30:00Z"

    KycPanStatusResponse:
      type: object
      description: Normalized KYC status response for a PAN number
      properties:
        status:
          type: string
          enum: [success]
          example: "success"
        pan:
          type: string
          description: The PAN number that was queried (uppercase)
          example: "ABCDE1234F"
        kyc_compliant:
          type: boolean
          description: |
            `true` if the investor has a `validated` or `registered` KYC record.
            Use this as the primary onboarding gate signal.
          example: true
        kyc_status:
          type: string
          description: |
            Normalized KYC status from the active KRA. Possible values:
            - `validated` — KYC complete, investor can onboard and transact freely
            - `registered` — KYC registered; some restrictions may apply depending on your platform's onboarding policy
            - `under_process` — Recently submitted KYC, still being processed by KRA
            - `on_hold` — KYC on hold due to discrepancy; check `remarks` on the KRA object
            - `rejected` — KYC rejected; investor must submit fresh KYC
            - `legacy` — Old/incomplete record; re-KYC recommended
            - `not_available` — No KYC record found at any KRA
            - `unknown` — Portal returned an unrecognized string; `raw_status` preserved
          enum:
            - validated
            - registered
            - under_process
            - on_hold
            - rejected
            - legacy
            - not_available
            - unknown
          example: "validated"
        kyc_mode:
          type: [string, "null"]
          description: |
            How the KYC was completed. Possible values:
            - `normal` — Physical/paper KYC
            - `digilocker` — DigiLocker-backed digital KYC
            - `ekyc` — Aadhaar eKYC (OTP-based)
            - `paper` — Offline paper submission
            - `unknown` — Mode string not recognized
          enum:
            - normal
            - digilocker
            - ekyc
            - paper
            - unknown
          example: "digilocker"
        active_kra:
          type: [string, "null"]
          description: Short key of the KRA where the active KYC record was found
          enum:
            - cvl
            - ndml
            - cams
            - karvy
            - kfin
          example: "cvl"
        registered_on:
          type: [string, "null"]
          format: date
          description: Date the KYC was first registered at the active KRA (ISO 8601)
          example: "2020-07-02"
        last_updated_on:
          type: [string, "null"]
          format: date
          description: Date the KYC record was last updated at the active KRA (ISO 8601)
          example: "2024-09-19"
        kras:
          type: object
          description: Per-KRA status breakdown. All five KRA keys are always present.
          required: [cvl, ndml, cams, karvy, kfin]
          properties:
            cvl:
              $ref: '#/components/schemas/KycKraStatus'
            ndml:
              $ref: '#/components/schemas/KycKraStatus'
            cams:
              $ref: '#/components/schemas/KycKraStatus'
            karvy:
              $ref: '#/components/schemas/KycKraStatus'
            kfin:
              $ref: '#/components/schemas/KycKraStatus'

    KycKraStatus:
      type: object
      description: |
        KYC status at a single KRA. All six keys are always present (never omitted).
        For `not_checked` and `not_available` KRAs, date/mode/remarks fields are `null`.
      required: [status, registered_on, last_updated_on, kyc_mode, remarks, raw_status]
      properties:
        status:
          type: string
          description: Normalized status for this KRA
          enum:
            - validated
            - registered
            - under_process
            - on_hold
            - rejected
            - legacy
            - not_available
            - not_checked
            - unknown
          example: "validated"
        registered_on:
          type: [string, "null"]
          format: date
          description: Date KYC was first registered at this KRA
          example: "2020-07-02"
        last_updated_on:
          type: [string, "null"]
          format: date
          description: Date KYC was last updated at this KRA
          example: "2024-09-19"
        kyc_mode:
          type: [string, "null"]
          description: KYC completion mode at this KRA
          enum:
            - normal
            - digilocker
            - ekyc
            - paper
            - unknown
          example: "digilocker"
        remarks:
          type: [string, "null"]
          description: |
            Remarks from the KRA. Only actionable when `status` is `on_hold`
            (e.g. `"APPLICANT PHOTO MISMATCH"`). For `validated` KRAs,
            remarks like `"FATCA NOT APPLICABLE"` can be safely ignored.
            Multiple remarks are comma-separated.
          example: "APPLICANT PHOTO MISMATCH IN THE APPLICATION,FATCA NOT APPLICABLE"
        raw_status:
          type: [string, "null"]
          description: |
            The original status string from the CVL portal. `null` for exact-matched
            statuses. Non-null when a fuzzy match or unknown string was encountered —
            preserve this for debugging and to help us expand coverage.
          example: "ON HOLD - New KYC"

    DigilockerAadhaar:
      type: object
      description: |
        e-Aadhaar (Aadhaar Paperless Offline eKYC) data parsed from DigiLocker XML.
        Any field may be null if not present in the source XML.
      properties:
        name:
          type: [string, "null"]
          description: Full name as on Aadhaar
          example: "Anjali Sharma"
        dob:
          type: [string, "null"]
          description: Date of birth (as returned by DigiLocker, typically DD-MM-YYYY)
          example: "16-05-1990"
        gender:
          type: [string, "null"]
          description: Gender (M, F, or T)
          example: "F"
        care_of:
          type: [string, "null"]
          description: Care-of / guardian field
          example: "S/O Rajesh Sharma"
        address:
          type: [string, "null"]
          description: Full address assembled from the Aadhaar address fields
          example: "12, MG Road, Indiranagar, Bengaluru, Karnataka, 560038, India"
        photo_base64:
          type: [string, "null"]
          description: Base64-encoded photograph from the Aadhaar XML
        masked_aadhaar:
          type: [string, "null"]
          description: Masked Aadhaar number (only last 4 digits visible)
          example: "XXXXXXXX1234"
        session_id:
          type: [string, "null"]
          description: DigiLocker/UIDAI reference id for this eKYC document

    DigilockerPan:
      type: object
      description: |
        PAN certificate data parsed from DigiLocker XML (returned as `parsed`
        when `parse=pan`). Any field may be null if absent in the source XML.
      properties:
        pan:
          type: [string, "null"]
          description: PAN number
          example: "ABCPD1234E"
        name:
          type: [string, "null"]
          description: PAN holder name
          example: "RAHUL SHARMA"
        father_name:
          type: [string, "null"]
          description: Father/spouse name (the `swd` field; often empty)
          example: null
        dob:
          type: [string, "null"]
          description: Date of birth (DD-MM-YYYY as returned)
          example: "22-03-1995"
        gender:
          type: [string, "null"]
          example: "MALE"
        status:
          type: [string, "null"]
          description: Certificate status (e.g. "A" = Active)
          example: "A"
        verified_on:
          type: [string, "null"]
          description: Timestamp DigiLocker verified the record
          example: "31-05-2026 03:55:02"
        signature:
          $ref: '#/components/schemas/DigilockerSignature'

    DigilockerDrivingLicence:
      type: object
      description: |
        Driving licence data parsed from DigiLocker XML (returned under
        `fetched.driving_licence`). Any field may be null if absent in the
        source XML.
      properties:
        dl_number:
          type: [string, "null"]
          example: "KA0120190008989"
        name:
          type: [string, "null"]
          example: "Rahul Sharma"
        father_name:
          type: [string, "null"]
          example: "Suresh Sharma"
        dob:
          type: [string, "null"]
          description: Date of birth, normalized to ISO 8601.
          example: "1995-03-22"
        gender:
          type: [string, "null"]
          example: "M"
        status:
          type: [string, "null"]
          example: "A"
        issued_at:
          type: [string, "null"]
          example: "RTO, Bengaluru"
        issue_date:
          type: [string, "null"]
          format: date
        valid_from:
          type: [string, "null"]
          format: date
        expiry_date:
          type: [string, "null"]
          format: date
        present_address:
          type: [string, "null"]
        permanent_address:
          type: [string, "null"]
        categories:
          type: array
          description: Vehicle classes the holder is licensed for.
          items:
            type: object
            properties:
              code:
                type: string
              abbreviation:
                type: string
              description:
                type: string
              issue_date:
                type: string
                format: date
        signature:
          $ref: '#/components/schemas/DigilockerSignature'

    DigilockerSignature:
      type: object
      description: |
        Signature provenance for a fetched document. Reports whether a signed
        XML block with an X.509 certificate is present, plus the signing
        certificate's details. Note: this is provenance reporting, not full
        XML-DSIG cryptographic verification (the trust model is direct-from-source
        retrieval, consistent with the industry).
      properties:
        signature_present:
          type: boolean
          example: true
        certificate:
          type: [object, "null"]
          properties:
            subject:
              type: string
              example: "C=IN,O=DIGITAL INDIA CORPORATION,CN=DS DIGITAL INDIA CORPORATION"
            issuer:
              type: string
            valid_from:
              type: string
              format: date-time
            valid_until:
              type: string
              format: date-time
            serial_number:
              type: string

    DigilockerConsent:
      type: object
      description: |
        Consent receipt captured at session start. Carried through the flow for
        audit (DPDP / RBI compliance).
      properties:
        purpose:
          type: [string, "null"]
          description: The consent_purpose provided at /session.
          example: "KYC for loan account opening"
        consented_at:
          type: [string, "null"]
          format: date-time
          description: ISO 8601 timestamp (UTC) when consent was captured.
          example: "2026-05-30T22:37:17+00:00"

    DigilockerVerifiedIdentity:
      type: object
      description: |
        The investor's verified identity. Only fields the investor shared are
        populated. `verified` contains the authenticated document identifiers
        (e.g. PAN, Aadhaar number).
      properties:
        name:
          type: [string, "null"]
          example: "Anjali Sharma"
        dob:
          type: [string, "null"]
          example: "1990-05-16"
        gender:
          type: [string, "null"]
          example: "F"
        email:
          type: [string, "null"]
          example: "anjali@example.com"
        mobile:
          type: [string, "null"]
          example: "98XXXXXX10"
        digilocker_id:
          type: [string, "null"]
          example: "rahul22031995"
        username:
          type: [string, "null"]
          description: DigiLocker preferred username
          example: "rahul22031995"
        care_of:
          type: [string, "null"]
          example: "S/O Rajesh Sharma"
        address:
          type: [string, "null"]
        verified:
          type: object
          description: Authenticated document identifiers (keys present only when verified).
          properties:
            pan:
              type: string
              example: "ABCDE1234F"
            aadhaar:
              type: string
              description: Usually masked
              example: "XXXXXXXX1234"
            driving_licence:
              type: string
              example: "KA01-20110012345"
          additionalProperties: true

    DigilockerDocument:
      type: object
      description: Metadata for a single issued document in the user's DigiLocker.
      properties:
        name:
          type: string
          description: Document name
          example: "PAN Verification Record"
        type:
          type: string
          example: "file"
        doctype:
          type: string
          description: 5-character DigiLocker document type code
          example: "PANCR"
        issuer:
          type: string
          example: "Income Tax Department"
        issuerid:
          type: string
          example: "in.gov.pan"
        uri:
          type: string
          description: Unique DigiLocker identifier for the document
          example: "in.gov.pan-PANCR-xxxxxxxxxxxx"
        mime:
          type: array
          items:
            type: string
          example: ["application/pdf", "application/xml"]
        date:
          type: [string, "null"]
          format: date
          description: Last modified date in DigiLocker, normalized to ISO 8601.
          example: "2024-09-19"

    InboundEmailWebhookPayload:
      type: object
      description: Webhook payload sent to your callback_url when an investor forwards a CAS email
      properties:
        inbound_email_id:
          type: string
          description: The inbound email address ID that received this email
          example: "ie_a1b2c3d4e5f6"
        forwarded_by:
          type: string
          format: email
          description: Email address of the investor who forwarded the CAS email
          example: "investor@gmail.com"
        reference:
          type: [string, "null"]
          description: Your reference from inbound email creation
          example: "user_12345"
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Your metadata from inbound email creation
          example:
            plan: "premium"
        files:
          type: array
          description: CAS files from the email (matches EmailCASFile schema)
          items:
            $ref: '#/components/schemas/EmailCASFile'
        count:
          type: integer
          description: Number of files
          example: 1
