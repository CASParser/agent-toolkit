    MfdVerifyResponse:
      type: object
      description: >-
        Result of an AMFI mutual-fund distributor (ARN) verification. Every
        listed property is always present on a 200 response (null when not
        applicable); `verified` is the boolean gate to act on.
      required:
        - status
        - verified
        - authority
        - category
        - arn
        - registration_status
        - negative_list_hit
      properties:
        status:
          type: string
          enum: [success]
        verified:
          type: boolean
          description: True only when the ARN is on the active register and not on an adverse list.
        authority:
          type: string
          enum: [AMFI]
        category:
          type: string
          enum: [mutual-fund-distributor]
        category_label:
          type: string
          example: Mutual Fund Distributor (ARN)
        arn:
          type: string
          example: "123456"
        name:
          type: string
          nullable: true
        euin:
          type: string
          nullable: true
        kyd_compliant:
          type: boolean
          nullable: true
        registration_status:
          type: string
          description: >-
            ACTIVE = on the active register; SUSPENDED / TERMINATED = on an AMFI
            adverse list (see `negative_list`); EXPIRED = ARN validity lapsed;
            NOT_FOUND = no active registration and not on an adverse list.
          enum: [ACTIVE, EXPIRED, SUSPENDED, TERMINATED, NOT_FOUND]
        valid_from:
          type: string
          format: date
          nullable: true
        valid_till:
          type: string
          format: date
          nullable: true
        is_perpetual:
          type: boolean
        address:
          type: string
          nullable: true
        pincode:
          type: string
          nullable: true
        negative_list_hit:
          type: boolean
          description: True when the ARN/EUIN appears on an AMFI adverse list.
        negative_list:
          type: object
          nullable: true
          description: Details of the adverse-list hit, else null.
          properties:
            type:
              type: string
              enum: [suspended, terminated, euin_terminated]
            since:
              type: string
              description: Effective date as published by AMFI.
      example:
        status: success
        verified: true
        authority: AMFI
        category: mutual-fund-distributor
        category_label: Mutual Fund Distributor (ARN)
        arn: "123456"
        name: Example Wealth Distributors LLP
        euin: E123456
        kyd_compliant: true
        registration_status: ACTIVE
        valid_from: "2024-04-01"
        valid_till: "2027-03-31"
        is_perpetual: false
        address: "MG Road, Bengaluru, Karnataka"
        pincode: "560001"
        negative_list_hit: false
        negative_list: null
