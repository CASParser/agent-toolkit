    EmailCASFile:
      type: object
      description: A CAS file found in the user's email inbox
      properties:
        message_id:
          type: string
          description: Unique identifier for the email message (use for subsequent API calls)
          example: "18d4a2b3c4d5e6f7"
        filename:
          type: string
          description: Standardized filename (provider_YYYYMMDD_uniqueid.pdf)
          example: "cdsl_20250115_a1b2c3d4.pdf"
        original_filename:
          type: string
          description: Original attachment filename from the email
          example: "CDSL_CAS_Statement.pdf"
        message_date:
          type: string
          format: date
          description: Date the email was received
          example: "2025-01-15"
        cas_type:
          type: string
          enum: [cdsl, nsdl, cams, kfintech]
          description: Detected CAS provider based on sender email
          example: "cdsl"
        sender_email:
          type: string
          format: email
          description: Email address of the CAS authority (CDSL, NSDL, CAMS, or KFintech) who originally sent this statement
          example: "eCAS@cdslstatement.com"
        size:
          type: integer
          description: File size in bytes
          example: 245000
        url:
          type: string
          format: uri
          description: Direct download URL (presigned, expires based on expires_in)
          example: "https://cdn.casparser.in/email-cas/user123/cdsl_20250115_a1b2c3d4.pdf"
        expires_in:
          type: integer
          description: |
            URL expiration time in seconds. Defaults vary by source:
            - Email Inbox Import (Gmail, Outlook, Zoho): 86400 (24h)
            - Inbound Email with `callback_url` set: 172800 (48h)
            - Inbound Email without `callback_url`: aligned with the session TTL (~30 min)
          example: 86400

    ReceivedEmailCASFile:
      description: |
        A CAS file that has arrived at an inbound email address.
        Matches `EmailCASFile` plus a `received_at` timestamp used as a
        monotonic cursor for polling.
      allOf:
        - $ref: '#/components/schemas/EmailCASFile'
        - type: object
          properties:
            received_at:
              type: string
              format: date-time
              description: |
                ISO 8601 timestamp (microsecond precision) when the file was
                persisted. Use as the `since` cursor on subsequent polls.
              example: "2025-02-21T10:45:12.000123+00:00"

